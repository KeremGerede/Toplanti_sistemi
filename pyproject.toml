[project]
name = "toplanti-sistemi"
version = "0.1.0"
description = "Kayıtlı ses dosyaları için speaker diarization modülü"
requires-python = ">=3.10"
dependencies = [
    "pyannote.audio>=4.0.7,<5",
    "soundfile>=0.12",
    "torch>=2.8",
    "torchaudio>=2.8",
    "openai-whisper>=20250625",
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx",
    "jiwer>=4.0.0",
]

# Windows/Linux'ta PyPI'daki torch wheel'i yalnızca CPU destekli; CUDA build'i PyTorch index'inden alınır.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: gerçek modeli çalıştırır (HF erişimi ve tests/data kayıtları gerekir)",
]
